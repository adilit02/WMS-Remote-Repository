<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

<script
	src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script
	src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

<style>
.main-container {
	display: grid;
	grid-template-columns: 4fr 8fr;
}

.rb {
	border-right: 2px solid red;
}
</style>
</head>
<body class="container">

	<h1>Purchase Product Screen 2</h1>
	<div class="main-container">
		<!--Left Side Start  -->
		<div class="form-group rb">
			<dl>
				<dt>Order Id</dt>
				<dd th:text="${vendorPerchaseDtl.id}"></dd>

				<dt>Status</dt>
				<dd th:text="${vendorPerchaseDtl.status}"></dd>
			</dl>
			<div class="form-group">
			
              <form th:action="@{/add}" th:method="post" th:object="${purchaeProduct}">
					<div>
						<input type="hidden" name="vendor.id" th:value="${vendorPerchaseDtl.id}">
					</div>
					<div class="form-group">
						<label>PRODUCT</label> <select class="form-select"
							th:field="*{product}">
							<option value=" ">--PRODUCT--</option>
							<option th:each="prod:${product}" th:value="${prod.key}"
								th:text="${prod.value}"></option>
						</select>
					</div>


					<div class="form-group">
						<label>Quntity</label> 
						<input type="number" th:field="*{quantity}" class="form-control">
					</div>

					<div class="mt-5">
						<input type="submit" value="Add Data" class="btn btn-primary">
					</div>

				</form>

			</div>
		</div>

		<!--Right Side Start  -->

		<div>
			<table class="table table-hover">
				<thead>
					<tr>
						<th>Sno</th>
						<th>Product Name</th>
						<th>Price</th>
						<th>Total</th>
						<th>Remove</th>
					</tr>
				</thead>


				<tbody>

					<tr th:each="li,i :${list}">
						<td th:text="${i.count}"></td>
						<td th:text="${li.product.pname}"></td>
						<td th:text="${li.product.price}"></td>
						<td th:text="${li.quantity}"></td>
						<td><a th:href="@{/#?vendorId={vendorId}(vendorId=${li.id})}">Remove</a></td>

					</tr>
				</tbody>

			</table>

		</div>
	</div>

</body>
</html>
