<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

<script
	src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script
	src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>

<body>

	<div class="container">
		<header th:insert="OrderMaster.html"> </header>
		<h1 class="text-center text-danger">Vendor Purchase Registration
			Screen # 1</h1>

		<form th:action="@{/savePerchase}" th:method="post"
			th:object="${vendperchase}">

			<div class="mb-3">

				<input type="hidden" class="form-control" id="exampleInputId"
					th:field="*{id}">

			</div>

			<div class="mb-3">
				<label for="exampleInputName" class="form-label">Order Code
					:</label> <input type="text" class="form-control" id="exampleInputName"
					aria-describedby="NameHelp" th:field="*{orderCode}">
			</div>

			<div class="mb-3">
				<label for="exampleInputEmail1" class="form-label">Status :</label>
				<input type="text" class="form-control" id="exampleInputEmail1"
					aria-describedby="emailHelp" th:field="*{status}">
			</div>

			<br>

			<div class="form-group mt-2">

				<label class="form-label">SHIPMENT TYPE:</label> <select
					class="form-select w-25" th:field="*{shipment}">
					<option value=" ">--SHIPMENT--</option>
					<option th:each="ship:${shipment}" th:value="${ship.key}"
						th:text="${ship.value}"></option>

				</select>

			</div>

			<div class="form-group mt-2">

				<label class="form-label">USER TYPE:</label> <select
					class="form-select w-25" th:field="*{user}">
					<option value=" ">--USER--</option>
					<option th:each="usr:${user}" th:value="${usr.key}"
						th:text="${usr.value}"></option>
				</select>
			</div>
			
			<br>
			
			<button type="submit" class="btn btn-primary">Register Here.</button><span><h2 class="text-success" th:text="${msg}"></h2></span>
		</form>
	</div>
 </body>
</html>
